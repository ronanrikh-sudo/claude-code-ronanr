<!doctype html><html lang="en-AU"><head><meta charset="utf-8">
<title>CAGECRAFT 30% off Fight Jerseys (Tiffany gym photo)</title>
<link rel="stylesheet" href="../../kit/brand.css">
<style>
  /* Big-type offer over a real CAGECRAFT photo. 4:5 master; ?v=916 for 9:16. Photo is untouched apart from crop and a dark gradient. */
  html,body{width:1080px;height:100vh;margin:0;overflow:hidden}
  body{position:relative;background:#0b0b0c}
  .abs{position:absolute}
  .photo{inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%}
  .shade{inset:0;background:linear-gradient(180deg,rgba(6,6,8,.88) 0%,rgba(6,6,8,.7) var(--t1),rgba(6,6,8,0) var(--t2),rgba(6,6,8,0) var(--b1),rgba(6,6,8,.62) var(--b2),rgba(6,6,8,.92) 100%)}
  .grain{inset:0;opacity:.16;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.15' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  .top{left:0;right:0;top:var(--top);display:flex;flex-direction:column;align-items:center;color:#fff}
  .logo{width:var(--logo);display:block;margin-bottom:var(--g1)}
  .w{font-family:var(--cc-display);font-weight:900;font-stretch:125%;text-transform:uppercase;line-height:.84;white-space:nowrap;letter-spacing:-.01em;text-shadow:0 6px 30px rgba(0,0,0,.35)}
  .l2{display:block;font-style:italic;color:#fff;margin-top:6px}
  .bot{left:0;right:0;bottom:var(--bot);display:flex;flex-direction:column;align-items:center;color:#fff}
  .small{margin-bottom:var(--g2)}
  .big{display:flex;align-items:center}
  .n{color:#63D6CC;font-family:var(--cc-display);font-weight:900;font-stretch:125%;line-height:.78;letter-spacing:-.04em;text-shadow:0 8px 40px rgba(0,0,0,.4)}
  .side{display:flex;flex-direction:column;align-items:flex-start;margin-left:10px}
  .pct{color:#63D6CC;font-family:var(--cc-display);font-weight:900;font-stretch:125%;line-height:.8}
  .off{font-family:var(--cc-display);font-weight:900;font-stretch:125%;line-height:.8;margin-top:4px}
  .foot{margin-top:var(--g3);font:700 21px/1 var(--cc-body);letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.88)}
</style></head><body>
<img class="abs photo" src="../../library/photo/jersey-tiffany/lifestyle-back-3.jpg" alt="">
<div class="abs shade"></div>
<div class="abs grain"></div>
<div class="abs top">
  <img class="logo" src="../../library/logo/logo-white.png" alt="CAGECRAFT">
  <span class="w fit" data-w="0.5">Fight</span>
  <span class="w fit l2" data-w="0.7">Jerseys</span>
</div>
<div class="abs bot">
  <span class="w fit small" data-w="0.4">Black Friday</span>
  <div class="big fitrow" data-w="0.62"><span class="n">30</span><div class="side"><span class="pct">%</span><span class="off">OFF</span></div></div>
  <div class="foot">Fight Jersey 2.0 · Five colourways · Ends Sunday</div>
</div>
<script>
const tall=new URLSearchParams(location.search).get("v")==="916";
const L=tall?{top:300,logo:300,g1:40,bot:290,g2:22,g3:44,t1:"22%",t2:"40%",b1:"55%",b2:"72%"}:{top:56,logo:280,g1:34,bot:58,g2:18,g3:36,t1:"20%",t2:"38%",b1:"52%",b2:"70%"};
const R=document.documentElement.style;
for(const[k,v]of Object.entries(L))R.setProperty("--"+k,typeof v==="number"?v+"px":v);
Promise.all([document.fonts.ready,...[...document.images].map(i=>i.complete?1:new Promise(r=>i.onload=i.onerror=r))]).then(()=>{
  for(const el of document.querySelectorAll(".fit")){el.style.fontSize="100px";el.style.display="inline-block";const w=el.getBoundingClientRect().width;el.style.fontSize=(100*1080*el.dataset.w/w)+"px";}
  const row=document.querySelector(".fitrow"),n=row.querySelector(".n"),pc=row.querySelector(".pct"),of=row.querySelector(".off");
  const set=s=>{n.style.fontSize=s+"px";pc.style.fontSize=s*.5+"px";of.style.fontSize=s*.33+"px";};
  set(100);set(100*1080*row.dataset.w/row.getBoundingClientRect().width);
  document.body.dataset.ready=1;
});
</script></body></html>
