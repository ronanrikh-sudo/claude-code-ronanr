<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>CAGECRAFT cover-art trend</title>
<link rel="stylesheet" href="../../kit/brand.css">
<style>
  html, body { width: 1080px; height: 100vh; overflow: hidden; }
  body { position: relative; background: #050506; }
  .p { position: absolute; inset: 0; background-size: cover; background-repeat: no-repeat; }
  .plate { position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #050506; }
  .plate img { width: 78%; height: auto; display: block; }
  .plate .bar { width: 78%; height: 6px; margin-top: 18px; background: linear-gradient(90deg, #F09EC0 0 50%, #16B3B7 50% 100%); }
  .plate .sub { margin-top: 16px; font: 800 19px/1 var(--cc-body); letter-spacing: .34em; text-transform: uppercase; color: #fff; padding-left: .34em; }
</style>
</head>
<body>
<div id="stage"></div>
<div class="plate" id="plate">
  <img src="../../library/logo/logo-white.png" alt="CAGECRAFT">
  <div class="bar"></div>
  <div class="sub">Fightwear Co.</div>
</div>
<script>
  // Angled panel grid. Every panel is a real CAGECRAFT photograph run through a fixed illustration filter (stylise.py).
  const tall = new URLSearchParams(location.search).get("v") === "916";
  const W = 1080, H = tall ? 1920 : 1350, G = 7;
  const k = H / 1350;
  const row = [ (x) => 0, (x) => (446 - 26 * x / W) * k, (x) => (892 + 30 * x / W) * k, (x) => H ];
  // vertical dividers per row: [xTop, xBottom] pairs (0 and W are the canvas edges)
  const cols = [ [[0,0],[420,376],[706,742],[W,W]], [[0,0],[366,340],[726,752],[W,W]], [[0,0],[352,392],[718,690],[W,W]] ];
  const pics = [
    ["car", "30% 50%"], ["city1", "50% 40%"], ["train3", "40% 30%"],
    ["hoodie", "50% 30%"], null, ["kick", "62% 40%"],
    ["city2", "45% 35%"], ["kit", "50% 28%"], ["train2", "50% 45%"],
  ];
  const stage = document.getElementById("stage");
  const pt = (r, c, top) => { const [xt, xb] = cols[r][c]; const x = top ? xt : xb; return [x, row[top ? r : r + 1](x)]; };
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
    let q = [pt(r, c, true), pt(r, c + 1, true), pt(r, c + 1, false), pt(r, c, false)];
    const cx = q.reduce((s, p) => s + p[0], 0) / 4, cy = q.reduce((s, p) => s + p[1], 0) / 4;
    q = q.map(([x, y]) => [x + Math.sign(cx - x) * G, y + Math.sign(cy - y) * G]);
    const xs = q.map(p => p[0]), ys = q.map(p => p[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const pic = pics[r * 3 + c];
    const el = pic ? document.createElement("div") : document.getElementById("plate");
    Object.assign(el.style, { left: x0 + "px", top: y0 + "px", width: (x1 - x0) + "px", height: (y1 - y0) + "px", right: "auto", bottom: "auto",
      clipPath: "polygon(" + q.map(([x, y]) => `${x - x0}px ${y - y0}px`).join(",") + ")" });
    if (pic) { el.className = "p"; el.dataset.photo = "stylised:" + pic[0]; el.style.backgroundImage = `url(panels/${pic[0]}.jpg)`; el.style.backgroundPosition = pic[1]; stage.appendChild(el); }
  }
</script>
</body>
</html>
