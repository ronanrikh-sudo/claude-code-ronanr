<!doctype html><html lang="en-AU"><head><meta charset="utf-8">
<title>CAGECRAFT Black Friday up to 40% off</title>
<link rel="stylesheet" href="../../kit/brand.css">
<style>
  /* 4:5 master (1080x1350); ?v=916 for 1080x1920 (type kept inside y 270-1650). Pure type ad: no product pixels. */
  html,body{width:1080px;height:100vh;margin:0;overflow:hidden}
  body{position:relative;background:#5c0a24}
  .abs{position:absolute}
  .bg{inset:0;background:radial-gradient(ellipse 75% 60% at 50% 46%,#e0336a 0%,#b81c4e 38%,#7d0f33 72%,#4a0619 100%)}
  #ripples{inset:0;width:100%;height:100%;mix-blend-mode:soft-light;opacity:.9}
  .grain{inset:0;opacity:.30;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.15' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  .vig{inset:0;background:radial-gradient(ellipse 80% 70% at 50% 48%,rgba(0,0,0,0) 55%,rgba(20,0,6,.45) 100%)}
  .stack{left:0;right:0;top:var(--top);display:flex;flex-direction:column;align-items:center;color:#fff}
  .logo{width:var(--logo);display:block;margin-bottom:var(--g1)}
  .w{font-family:var(--cc-display);font-weight:900;font-stretch:125%;text-transform:uppercase;line-height:.84;white-space:nowrap;letter-spacing:-.01em}
  .black{display:block}
  .friday{display:block;font-style:italic;color:transparent;-webkit-text-stroke:var(--stroke) #fff;margin-top:6px}
  .upto{margin-top:var(--g2)}
  .big{display:flex;align-items:center;margin-top:var(--g3)}
  .n{font-family:var(--cc-display);font-weight:900;font-stretch:125%;line-height:.78;letter-spacing:-.04em}
  .side{display:flex;flex-direction:column;align-items:flex-start;margin-left:10px}
  .pct{font-family:var(--cc-display);font-weight:900;font-stretch:125%;line-height:.8}
  .off{font-family:var(--cc-display);font-weight:900;font-stretch:125%;line-height:.8;margin-top:4px}
  .foot{left:0;right:0;top:var(--foot);text-align:center;font:700 21px/1 var(--cc-body);letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.82)}
</style></head><body>
<div class="abs bg"></div>
<svg class="abs" id="ripples" viewBox="0 0 1080 1920" preserveAspectRatio="none"></svg>
<div class="abs vig"></div>
<div class="abs grain"></div>
<div class="abs stack">
  <img class="logo" src="../../library/logo/logo-white.png" alt="CAGECRAFT">
  <span class="w fit black" data-w="0.80">Black</span>
  <span class="w fit friday" data-w="0.86">Friday</span>
  <span class="w fit upto" data-w="0.38">Up to</span>
  <div class="big fitrow" data-w="0.84"><span class="n">40</span><div class="side"><span class="pct">%</span><span class="off">OFF</span></div></div>
</div>
<div class="abs foot">Free gifts as you spend · Ends Sunday</div>
<script>
const tall=new URLSearchParams(location.search).get("v")==="916";
const H=tall?1920:1350;
const L=tall?{top:430,logo:430,g1:70,g2:96,g3:34,foot:1560,stroke:4}:{top:150,logo:400,g1:60,g2:78,g3:26,foot:1250,stroke:4};
const R=document.documentElement.style;
for(const[k,v]of Object.entries(L))R.setProperty("--"+k,v+"px");
// dune ripples: many gently warped contour lines
const svg=document.getElementById("ripples");let p="";
for(let i=0;i<120;i++){const y0=-60+i*17;let d="M -20 "+y0;
  for(let x=-20;x<=1100;x+=20){const y=y0+Math.sin(x/170+i*.33)*26+Math.sin(x/61+i*.9)*6+Math.sin((x+i*40)/420)*44;d+=" L "+x+" "+y.toFixed(1);}
  const o=(.16+.14*Math.abs(Math.sin(i*.37))).toFixed(3);
  p+=`<path d="${d}" fill="none" stroke="rgba(255,255,255,${o})" stroke-width="2.2"/><path d="${d}" transform="translate(0,5)" fill="none" stroke="rgba(0,0,0,${o})" stroke-width="2.6"/>`;}
svg.innerHTML=p;
document.fonts.ready.then(()=>{
  for(const el of document.querySelectorAll(".fit")){el.style.fontSize="100px";el.style.display="inline-block";const w=el.getBoundingClientRect().width;el.style.fontSize=(100*1080*el.dataset.w/w)+"px";}
  const row=document.querySelector(".fitrow"),n=row.querySelector(".n"),pc=row.querySelector(".pct"),of=row.querySelector(".off");
  let s=100;n.style.fontSize=s+"px";pc.style.fontSize=s*.5+"px";of.style.fontSize=s*.33+"px";
  s=s*1080*row.dataset.w/row.getBoundingClientRect().width;n.style.fontSize=s+"px";pc.style.fontSize=s*.5+"px";of.style.fontSize=s*.33+"px";
  document.body.dataset.ready=1;
});
</script></body></html>
