<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
/* "Gifts sorted for him": the Fight Card look (black cage, Tiffany teal, Cotton Candy pink,
   extended heavy italic) applied to gift-giving. Layouts are built on a 1080 x ~1340 "box";
   4:5 uses the whole canvas, 9:16 puts the same box inside the Stories safe area. */
@font-face { font-family: "Archivo"; font-style: normal; font-display: block; font-weight: 100 900; font-stretch: 62% 125%;
  src: url("../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2") format("woff2"); }
@font-face { font-family: "Archivo"; font-style: italic; font-display: block; font-weight: 100 900; font-stretch: 62% 125%;
  src: url("../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-italic.woff2") format("woff2"); }
@font-face { font-family: "Caveat"; font-weight: 700; font-display: block;
  src: url("../node_modules/@fontsource/caveat/files/caveat-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Marker"; font-weight: 400; font-display: block;
  src: url("../node_modules/@fontsource/permanent-marker/files/permanent-marker-latin-400-normal.woff2") format("woff2"); }

:root {
  --ink: #060607; --white: #fff; --teal: #16B3B7; --teal-hi: #7FE6E4; --pink: #F09EC0; --pink-hot: #E9579A;
  --grey: #9EA3AB; --dim: #5E636C; --paper: #F4F1EA; --red: #D3242C;
  --mesh: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='28' height='28'><path d='M14 1 L27 14 L14 27 L1 14 Z' fill='none' stroke='white' stroke-width='1.6'/></svg>");
  --oct: polygon(29.3% 0, 70.7% 0, 100% 29.3%, 100% 70.7%, 70.7% 100%, 29.3% 100%, 0 70.7%, 0 29.3%);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { width: 1080px; font-family: "Archivo", system-ui, sans-serif; color: var(--white); -webkit-font-smoothing: antialiased; }

/* ---------- canvas + safe box ---------- */
.canvas { position: relative; width: 1080px; overflow: hidden; background: #070809; }
.canvas::before { content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(900px 700px at 88% 6%, rgba(22,179,183,.42), transparent 70%),
    radial-gradient(900px 800px at 0% 70%, rgba(240,158,192,.22), transparent 70%); }
.canvas::after { content: ""; position: absolute; inset: 0; background-image: var(--mesh); background-size: 46px 46px; opacity: .07; }
.box { position: absolute; left: 0; right: 0; z-index: 1; display: flex; flex-direction: column; padding: 52px 56px 0; }
.box > * { flex-shrink: 0; }

/* ---------- shared pieces ---------- */
.toprow { display: flex; justify-content: space-between; align-items: center; }
.logo { width: 280px; filter: drop-shadow(0 3px 8px rgba(0,0,0,.6)); }
.kicker { display: inline-block; transform: skewX(-12deg); background: var(--ink); box-shadow: 0 0 0 3px var(--teal); padding: 10px 22px 9px; }
.kicker span { display: block; transform: skewX(12deg); font-weight: 900; font-style: italic; font-stretch: 112%; font-size: 26px; letter-spacing: .04em; text-transform: uppercase; }
.kicker.pink { background: var(--pink); box-shadow: 0 0 0 3px var(--ink); }
.kicker.pink span { color: var(--ink); }
.h1 { font-weight: 900; font-style: italic; font-stretch: 125%; text-transform: uppercase; line-height: .88; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; }
.h1 em { color: var(--teal); font-style: italic; }
.sub { font-weight: 600; font-stretch: 100%; font-size: 40px; line-height: 1.2; color: #E7E9EC; }
.cta { align-self: flex-start; transform: skewX(-12deg); background: var(--white); color: var(--ink); padding: 18px 34px 16px; box-shadow: 8px 8px 0 var(--teal); }
.cta span { display: block; transform: skewX(12deg); font-weight: 900; font-style: italic; font-stretch: 112%; font-size: 32px; letter-spacing: .03em; text-transform: uppercase; }
.strip { flex: none; height: 84px; margin: 0 -56px; background: var(--teal); color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 26px;
  font-weight: 900; font-style: italic; font-stretch: 112%; font-size: 25px; letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; }
.strip i { flex: none; width: 12px; height: 12px; background: var(--ink); clip-path: var(--oct); display: block; }
.price { display: inline-flex; align-items: baseline; gap: 12px; background: var(--ink); padding: 8px 14px 7px; border-radius: 8px; white-space: nowrap; }
.price b { font-weight: 900; font-style: italic; font-size: 34px; letter-spacing: -.01em; }
.price s { font-weight: 700; font-size: 22px; color: var(--grey); text-decoration-color: var(--pink); text-decoration-thickness: 3px; }

/* gift tag with a string */
.tag { position: absolute; z-index: 5; width: 300px; height: 128px; filter: drop-shadow(0 10px 18px rgba(0,0,0,.5)); }
.tag .shape { position: absolute; inset: 0; background: var(--pink); clip-path: polygon(17% 0, 100% 0, 100% 100%, 17% 100%, 0 50%); }
.tag .hole { position: absolute; left: 30px; top: 58px; width: 24px; height: 24px; border-radius: 50%; background: #070809; box-shadow: inset 0 0 0 4px rgba(0,0,0,.25); }
.tag .lines { position: absolute; left: 86px; top: 16px; right: 18px; color: var(--ink); }
.tag .row { display: flex; align-items: baseline; gap: 12px; border-bottom: 2px solid rgba(6,6,7,.25); padding: 2px 0 1px; }
.tag .row b { font: 900 italic 20px/1 "Archivo"; font-stretch: 112%; letter-spacing: .06em; width: 70px; }
.tag .row span { font: 700 46px/1 "Caveat"; }
.tag svg { position: absolute; left: -150px; top: 20px; width: 200px; height: 110px; overflow: visible; }

/* product photo tile */
.tile { position: relative; overflow: hidden; border-radius: 10px; background: #15171a; box-shadow: 0 0 0 2px rgba(255,255,255,.08), 0 12px 30px rgba(0,0,0,.45); }
.tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.tile .shade { position: absolute; inset: auto 0 0 0; height: 60%; background: linear-gradient(180deg, transparent, rgba(0,0,0,.8)); }
.tile .label { position: absolute; left: 18px; right: 18px; bottom: 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.tile .name { font-weight: 900; font-style: italic; font-stretch: 112%; font-size: 30px; line-height: 1; text-transform: uppercase; text-shadow: 0 2px 8px rgba(0,0,0,.6); }

/* octagon badge */
.oct { position: relative; clip-path: var(--oct); background: var(--ink); }
.oct::before { content: ""; position: absolute; inset: 7px; clip-path: var(--oct); background: var(--teal); }
.oct::after { content: ""; position: absolute; inset: 7px; clip-path: var(--oct); background-image: var(--mesh); background-size: 26px 26px; opacity: .16; }
.oct .in { position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--ink); font-style: italic; text-transform: uppercase; }

/* ---------- HERO ---------- */
.hero .h1 { font-size: 168px; margin-top: 34px; }
.hero .sub { margin-top: 22px; }
.hero .grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 20px; margin: 34px 0 28px; }

/* ---------- VERSUS ---------- */
.vs .h1 { font-size: 118px; margin-top: 30px; }
.vs .cols { position: relative; flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin: 34px 0 26px; }
.panel { position: relative; border-radius: 12px; padding: 64px 26px 26px; display: flex; flex-direction: column; overflow: hidden; }
.panel .ptab { position: absolute; left: 0; top: 0; right: 0; padding: 14px 20px 12px; font-weight: 900; font-style: italic; font-stretch: 112%; font-size: 24px; letter-spacing: .06em; text-transform: uppercase; }
.panel.couch { background: #141518; box-shadow: inset 0 0 0 3px #2B2E33; filter: saturate(.2); }
.panel.couch .ptab { background: #2B2E33; color: #A7ABB3; }
.panel.cage { background: radial-gradient(420px 380px at 50% 34%, rgba(22,179,183,.55), rgba(10,30,31,.9) 70%), #0b1213; box-shadow: inset 0 0 0 3px var(--teal); }
.panel.cage .ptab { background: var(--teal); color: var(--ink); }
.panel .art { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
.panel .art img { max-height: 100%; max-width: 92%; object-fit: contain; filter: drop-shadow(0 18px 26px rgba(0,0,0,.6)); }
.panel .art svg { width: 82%; height: auto; max-height: 100%; }
.panel .ttl { font-weight: 900; font-style: italic; font-stretch: 112%; font-size: 50px; line-height: .92; text-transform: uppercase; margin: 14px 0 16px; white-space: nowrap; }
.panel.couch .ttl { color: #C9CCD1; }
.panel ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
.panel li { font-weight: 700; font-size: 28px; line-height: 1.1; display: flex; gap: 12px; align-items: baseline; }
.panel li b { font-weight: 900; font-size: 30px; width: 26px; flex: none; }
.panel.couch li { color: #A7ABB3; } .panel.couch li b { color: var(--pink-hot); }
.panel.cage li b { color: var(--teal-hi); }
.panel .price { position: absolute; right: 18px; top: 74px; z-index: 2; }
.vs .vsbadge { position: absolute; left: 50%; top: 46%; width: 120px; height: 120px; transform: translate(-50%, -50%); z-index: 3; filter: drop-shadow(0 8px 16px rgba(0,0,0,.6)); }
.vs .vsbadge .in { font-weight: 900; font-stretch: 125%; font-size: 46px; }

/* ---------- LIST ---------- */
.list .h1 { font-size: 104px; margin-top: 30px; }
.list .stage { position: relative; flex: 1; margin: 30px 0 26px; }
.note { position: absolute; left: 0; top: 18px; width: 600px; bottom: 18px; background: var(--paper); color: #1d1d1f; transform: rotate(-3deg); border-radius: 4px;
  box-shadow: 0 24px 40px rgba(0,0,0,.55);
  background-image: linear-gradient(90deg, transparent 74px, rgba(211,36,44,.45) 74px, rgba(211,36,44,.45) 77px, transparent 77px),
                    repeating-linear-gradient(180deg, transparent 0 63px, rgba(40,90,160,.22) 63px 65px);
  background-position: 0 0, 0 52px; padding: 46px 30px 30px 100px; }
.note .tape { position: absolute; top: -22px; left: 50%; width: 180px; height: 48px; transform: translateX(-50%) rotate(3deg); background: rgba(230,222,200,.75); box-shadow: 0 2px 6px rgba(0,0,0,.15); }
.note .t { font: 700 70px/1 "Caveat"; margin-bottom: 6px; }
.note .for { font: 700 46px/1.3 "Caveat"; color: #555; margin-bottom: 4px; }
.note .item { position: relative; font: 700 52px/1.24 "Caveat"; white-space: nowrap; }
.note .item.x { color: #6b6b6b; }
.note .item.x::after { content: ""; position: absolute; left: -10px; right: -14px; top: 52%; height: 7px; background: var(--red); border-radius: 4px; transform: rotate(-2.5deg); opacity: .92; }
.note .item.ok b { color: var(--teal); font: 400 46px/1 "Marker"; margin-right: 10px; }
.list .cut { position: absolute; filter: drop-shadow(0 22px 28px rgba(0,0,0,.6)); }
.list .cut img { display: block; width: 100%; }
.list .cut .price { position: absolute; }

/* ---------- PERSONA ---------- */
.persona .photo { position: relative; flex: 1; margin: calc(-52px - var(--st)) -56px 0; min-height: 380px; overflow: hidden; }
.persona .photo img.ph { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.persona .photo .fade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.45) 0%, transparent 26%, transparent 60%, #070809 100%); }
.persona .photo .toprow { position: absolute; left: 56px; right: 56px; top: calc(var(--st) + 52px); z-index: 2; }
.persona .h1 { font-size: 100px; margin-top: 6px; }
.persona .sub { margin-top: 18px; }
.persona .picks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 28px 0 26px; }
.pick { position: relative; height: 196px; border-radius: 10px; background: radial-gradient(160px 140px at 50% 40%, rgba(22,179,183,.35), transparent 75%), #111416; box-shadow: inset 0 0 0 2px rgba(255,255,255,.08); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.pick img { height: 150px; width: auto; max-width: 86%; object-fit: contain; margin-top: -24px; filter: drop-shadow(0 10px 14px rgba(0,0,0,.6)); }
.pick .price { position: absolute; left: 10px; right: 10px; bottom: 10px; justify-content: center; padding: 6px 8px 5px; }
.pick .price b { font-size: 28px; } .pick .price s { font-size: 19px; }

/* ---------- BUDGET (1:1 carousel cards) ---------- */
.bcard .photo { position: absolute; inset: 0; }
.bcard .photo img { width: 100%; height: 100%; object-fit: cover; }
.bcard .toplight { position: absolute; inset: 0 0 auto 0; height: 34%; background: linear-gradient(180deg, rgba(0,0,0,.45), transparent); }
.bcard .scrim { position: absolute; inset: auto 0 0 0; height: 55%; background: linear-gradient(180deg, transparent, rgba(0,0,0,.6)); }
.bcard .logo { position: absolute; right: 46px; top: 50px; width: 270px; z-index: 3; }
.bcard .budget { position: absolute; left: 44px; top: 44px; width: 300px; height: 300px; z-index: 3; filter: drop-shadow(0 10px 18px rgba(0,0,0,.45)); }
.bcard .budget .in small { font-weight: 900; font-stretch: 125%; font-size: 40px; letter-spacing: .06em; line-height: 1; }
.bcard .budget .in big { font-weight: 900; font-stretch: 100%; font-size: 124px; line-height: .86; letter-spacing: -.04em; }
.bcard .plate { position: absolute; left: 0; right: 0; bottom: 0; height: 250px; z-index: 2; }
.bcard .plate .edge { position: absolute; inset: 0; background: var(--teal); clip-path: polygon(0 56px, 100% 0, 100% 100%, 0 100%); }
.bcard .plate .body { position: absolute; inset: 0; background: var(--ink); clip-path: polygon(0 66px, 100% 10px, 100% 100%, 0 100%); }
.bcard .plate .body::after { content: ""; position: absolute; inset: 0; background-image: var(--mesh); background-size: 32px 32px; opacity: .06; }
.bcard .pname { position: absolute; z-index: 3; left: 48px; right: 400px; white-space: nowrap; overflow: hidden; bottom: 98px; font-weight: 900; font-style: italic; font-stretch: 112%; font-size: 52px; line-height: 1; text-transform: uppercase; }
.bcard .pnote { position: absolute; z-index: 3; left: 48px; bottom: 50px; font-weight: 700; font-stretch: 125%; font-size: 24px; letter-spacing: .16em; text-transform: uppercase; color: var(--teal); }
.bcard .pprice { position: absolute; z-index: 3; right: 48px; bottom: 44px; text-align: right; }
.bcard .pprice s { display: block; font-weight: 800; font-size: 32px; color: var(--grey); text-decoration-color: var(--pink); text-decoration-thickness: 4px; }
.bcard .pprice b { display: block; font-weight: 900; font-style: italic; font-size: 92px; line-height: .9; letter-spacing: -.02em; }
.bintro .box, .bgift .box { padding: 56px; }
.bintro .h1 { font-size: 150px; margin-top: 40px; }
.bintro .sub { margin-top: 26px; display: flex; align-items: center; gap: 16px; }
.bintro .cuts { position: absolute; right: -30px; bottom: -40px; width: 620px; height: 560px; }
.bintro .cuts img { position: absolute; filter: drop-shadow(0 20px 26px rgba(0,0,0,.6)); }
.bgift .h1 { font-size: 110px; margin-top: 40px; }
.gc { position: absolute; right: -50px; bottom: -150px; width: 560px; transform: rotate(-6deg); border-radius: 18px; overflow: hidden; box-shadow: 0 30px 50px rgba(0,0,0,.6); }
.gc img { display: block; width: 100%; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// window.__DATA__ (from scripts/render-gifts.mjs):
// { mode, width, height, safe: {top,bottom}, logo, sale: {on, strip, offStrip}, cta, ...mode data }
const D = window.__DATA__;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const rich = (s) => esc(s).replace(/\*(.+?)\*/g, "<em>$1</em>");
const lines = (arr) => arr.map(rich).join("<br>");
const money = (n) => "$" + n.toFixed(2);
const imgStyle = (p) => `object-position:${p.focus || "50% 50%"};transform-origin:${p.focus || "50% 50%"};transform:scale(${p.zoom || 1})`;

const priceChip = (p) => D.sale.on && p.sale != null
  ? `<span class="price"><b>${money(p.sale)}</b><s>${money(p.price)}</s></span>`
  : `<span class="price"><b>${money(p.price)}</b></span>`;
const strip = () => `<div class="strip">${(D.sale.on ? D.sale.strip : D.sale.offStrip).map(esc).join("<i></i>")}</div>`;
const topRow = (kicker, pink) => `<div class="toprow"><div class="kicker ${pink ? "pink" : ""}"><span>${esc(kicker)}</span></div><img class="logo" src="${D.logo}"></div>`;
const cta = () => `<div class="cta"><span>${esc(D.cta)} &rarr;</span></div>`;
const tag = (style) => `
  <div class="tag" style="${style}">
    <svg viewBox="0 0 200 110"><path d="M160 50 C 120 10, 60 110, 0 40" fill="none" stroke="#E9E2D0" stroke-width="4" stroke-linecap="round"/></svg>
    <div class="shape"></div><div class="hole"></div>
    <div class="lines"><div class="row"><b>TO:</b><span>him</span></div><div class="row"><b>FROM:</b><span>you</span></div></div>
  </div>`;
const oct = (inner, cls, style = "") => `<div class="oct ${cls}" style="${style}"><div class="in">${inner}</div></div>`;

// generic couch + controller (no console or game branding)
const couchArt = `
<svg viewBox="0 0 400 300" fill="none" stroke="#7A7F87" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
  <path d="M60 150 V110 a30 30 0 0 1 30 -30 h220 a30 30 0 0 1 30 30 v40"/>
  <path d="M40 150 a26 26 0 0 1 52 0 v30 h216 v-30 a26 26 0 0 1 52 0 v70 H40 Z"/>
  <path d="M70 220 v26 M330 220 v26"/>
  <g transform="translate(150 98) rotate(-8)">
    <path d="M20 30 C 6 30, 0 62, 12 70 C 22 76, 32 60, 42 58 H 78 C 88 60, 98 76, 108 70 C 120 62, 114 30, 100 30 Z" fill="#2B2E33"/>
    <path d="M34 44 v12 M28 50 h12" stroke-width="6"/><circle cx="88" cy="46" r="4" fill="#7A7F87" stroke="none"/><circle cx="96" cy="54" r="4" fill="#7A7F87" stroke="none"/>
  </g>
</svg>`;

let html = "";
const m = D.mode;
if (m === "hero") {
  html = `
  <div class="box hero">
    ${topRow(D.kicker)}
    <div class="h1 fit" data-max="168">${lines(D.headline)}</div>
    <div class="sub">${esc(D.sub)}</div>
    <div class="grid">${D.tiles.map((p) => `
      <div class="tile"><img src="${p.src}" style="${imgStyle(p)}"><div class="shade"></div>
        <div class="label"><div class="name">${esc(p.short)}</div>${priceChip(p)}</div></div>`).join("")}
    </div>
    ${strip()}
  </div>
  ${tag("right: 40px; top: calc(var(--st) + 150px); transform: rotate(9deg);")}`;
} else if (m === "versus") {
  const j = D.cage;
  html = `
  <div class="box vs">
    ${topRow("This Christmas")}
    <div class="h1 fit" data-max="118">Get him off<br>the <em>couch.</em></div>
    <div class="cols">
      <div class="panel couch"><div class="ptab">The couch gift</div>
        <div class="art">${couchArt}</div>
        <div class="ttl fit" data-max="50">${lines(D.left)}</div>
        <ul><li><b>&times;</b>Couch hours: maxed</li><li><b>&times;</b>Cardio: zero</li><li><b>&times;</b>Rage-quits at 2am</li></ul>
      </div>
      <div class="panel cage"><div class="ptab">The cage gift</div>
        ${priceChip(j)}
        <div class="art"><img src="${j.cut}"></div>
        <div class="ttl fit" data-max="50">Fight<br>Jersey</div>
        <ul><li><b>&check;</b>Rounds on the mats</li><li><b>&check;</b>Lives in his gym bag</li><li><b>&check;</b>He'll actually use it</li></ul>
      </div>
      ${oct("VS", "vsbadge")}
    </div>
    <div style="margin-bottom:26px">${cta()}</div>
    ${strip()}
  </div>`;
} else if (m === "list") {
  const [jer, hood] = D.cuts;
  html = `
  <div class="box list">
    ${topRow("His Christmas list")}
    <div class="h1 fit" data-max="104">Upgrade his<br><em>Christmas list.</em></div>
    <div class="stage">
      <div class="note"><div class="tape"></div>
        <div class="t">Xmas list &#9733;</div>
        <div class="for">for him &mdash;</div>
        ${D.struck.map((s) => `<div class="item x">${esc(s)}</div>`).join("")}
        <div class="item ok"><b>&check;</b>Fight jersey</div>
        <div class="item ok"><b>&check;</b>Walkout hoodie</div>
        <div class="item ok"><b>&check;</b>Socks for the gym bag</div>
      </div>
      <div class="cut" style="right:-10px; top:-10px; width:330px; transform:rotate(7deg)"><img src="${jer.cut}">
        <div class="price" style="left:30px; top:24px">${priceChip(jer).replace(/^<span class="price">|<\/span>$/g, "")}</div></div>
      <div class="cut" style="right:-30px; bottom:-20px; width:420px; transform:rotate(-5deg)"><img src="${hood.cut}">
        <div class="price" style="left:56px; bottom:60px">${priceChip(hood).replace(/^<span class="price">|<\/span>$/g, "")}</div></div>
    </div>
    <div style="margin-bottom:26px">${cta()}</div>
    ${strip()}
  </div>`;
} else if (m === "persona") {
  html = `
  <div class="box persona">
    <div class="photo"><img class="ph" src="${D.photo.src}" style="${imgStyle(D.photo)}"><div class="fade"></div>${topRow(D.kicker, true)}</div>
    <div class="h1 fit" data-max="100">${lines(D.headline)}</div>
    <div class="sub">${esc(D.sub)}</div>
    <div class="picks">${D.picks.map((p) => `<div class="pick"><img src="${p.cut}">${priceChip(p)}</div>`).join("")}</div>
    ${strip()}
  </div>
  ${tag("right: 46px; top: calc(var(--st) + var(--tagY)); transform: rotate(-7deg);")}`;
} else if (m === "budget") {
  const p = D.card;
  const showSale = D.sale.on && p.sale != null;
  html = `
  <div class="bcard">
    <div class="photo"><img src="${p.src}" style="${imgStyle(p)}"></div><div class="toplight"></div><div class="scrim"></div>
    ${oct(`<small>Under</small><big>$${p.tier}</big>`, "budget")}
    <img class="logo" src="${D.logo}">
    <div class="plate"><div class="edge"></div><div class="body"></div></div>
    <div class="pname fit" data-max="52">${esc(p.name)}</div>
    <div class="pnote">${showSale ? "Black Friday price" : "Christmas gift guide"}</div>
    <div class="pprice">${showSale ? `<s>${money(p.price)}</s>` : ""}<b>${money(showSale ? p.sale : p.price)}</b></div>
  </div>`;
} else if (m === "budget-intro") {
  html = `
  <div class="box bintro">
    ${topRow(D.kicker)}
    <div class="h1 fit" data-max="150">${lines(D.headline)}</div>
    <div class="sub">${esc(D.sub)} <span style="color:var(--teal);font-weight:900">&rarr;</span></div>
    <div class="cuts">
      <img src="${D.cuts[2]}" style="width:300px; left:20px; top:40px; transform:rotate(-10deg)">
      <img src="${D.cuts[1]}" style="width:300px; left:290px; top:0; transform:rotate(8deg)">
      <img src="${D.cuts[0]}" style="width:380px; left:120px; top:200px; transform:rotate(-3deg)">
    </div>
  </div>
  ${tag("left: 60px; bottom: 90px; transform: rotate(-6deg);")}`;
} else if (m === "budget-gift") {
  html = `
  <div class="box bgift">
    ${topRow("The MMA gift guide")}
    <div class="h1 fit" data-max="110">${lines(D.headline)}</div>
    <div class="sub" style="margin-top:28px; font-size:44px">${esc(D.sub)}.<br>They pick the size.</div>
  </div>
  <div class="gc"><img src="${D.giftcard}"></div>`;
}

const root = document.getElementById("root");
root.innerHTML = `<div class="canvas" style="height:${D.height}px; --st:${D.safe.top}px; --sb:${D.safe.bottom}px; --tagY:${D.tagY || 300}px">${html}</div>`;
const box = root.querySelector(".box");
if (box) { box.style.top = D.safe.top + "px"; box.style.bottom = D.safe.bottom + "px"; }

// shrink headlines until the widest line fits the column
function fit() {
  for (const el of document.querySelectorAll(".fit")) {
    let size = +el.dataset.max;
    el.style.fontSize = size + "px";
    while (el.scrollWidth > el.clientWidth + 1 && size > 20) { size -= 2; el.style.fontSize = size + "px"; }
  }
}
window.__ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map((im) => im.decode().catch(() => {})));
  fit();
  const over = [...document.querySelectorAll(".box > *")].filter((el) => el.scrollHeight > el.clientHeight + 16 && getComputedStyle(el).overflow === "hidden").length;
  return { overflowing: over };
})();
</script>
</body>
</html>
