<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Archivo";src:url(fonts/archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%}
:root{--ink:#060607;--white:#F4F2EE;--grey:#9A948B;--red:#D61921}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1440px;background:var(--ink);overflow:hidden}
#p{position:relative;width:1080px;height:1440px;overflow:hidden;background:var(--ink) url(bg_ufc.png) 0 0/1080px 1440px;
  font-family:"Archivo";-webkit-font-smoothing:antialiased;font-kerning:normal}
.abs{position:absolute}
.c{font-stretch:62%}           /* extra condensed */
.n{font-stretch:75%}           /* condensed */

/* event lockup */
.war{left:50%;top:38px;width:322px;transform:translateX(-50%);filter:drop-shadow(0 8px 22px rgba(0,0,0,.7))}
.num{left:50%;top:150px;width:366px;transform:translateX(-50%);
  filter:drop-shadow(0 0 40px rgba(214,25,33,.45)) drop-shadow(0 18px 30px rgba(0,0,0,.75))}

/* fighters */
.f{top:80px;width:620px;height:1020px}
.f img{width:100%;height:100%;display:block}
.fL{left:0;transform-origin:210px 250px;transform:scale(1.2)}
.fR{left:460px;transform-origin:425px 270px;transform:translateX(-14px) scale(1.2);
  filter:drop-shadow(-18px 0 26px rgba(0,0,0,.65))}
.floor{left:0;right:0;top:760px;bottom:0;background:linear-gradient(180deg,rgba(6,6,7,0) 0%,rgba(6,6,7,.6) 26%,rgba(6,6,7,.93) 46%,var(--ink) 62%)}
.fx{inset:0;background:url(fx_ufc.png) 0 0/1080px 1440px;mix-blend-mode:screen}

/* names */
.bout{left:0;right:0;top:884px;text-align:center}
.bout span{display:inline-block;background:var(--red);color:#fff;font-weight:800;font-stretch:75%;font-size:17px;letter-spacing:.34em;
  padding:8px 10px 8px 18px;line-height:1}
.names{left:0;right:0;top:926px;display:flex;justify-content:center;align-items:flex-end;gap:26px}
.nm{display:flex;flex-direction:column}
.first{font-weight:800;font-stretch:75%;font-size:38px;letter-spacing:.06em;color:var(--red);line-height:1;margin:0 0 4px 6px}
.sur{font-weight:900;font-stretch:62%;font-size:192px;line-height:.76;letter-spacing:-.01em;text-transform:uppercase;
  background:linear-gradient(180deg,#FFFFFF 0%,#F1EEE9 52%,#B9B3AA 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 16px rgba(0,0,0,.8))}
.vs{font-weight:900;font-stretch:62%;font-size:74px;line-height:1;color:var(--red);padding-bottom:30px;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.8))}

/* details */
.date{left:0;right:0;top:1146px;text-align:center;font-weight:800;font-stretch:75%;font-size:46px;letter-spacing:.03em;color:var(--white);line-height:1}
.date b{color:var(--red);font-weight:800}
.venue{left:0;right:0;top:1204px;text-align:center;font-weight:600;font-stretch:100%;font-size:15px;letter-spacing:.24em;color:var(--grey);line-height:1}
.tix{left:0;right:0;top:1236px;display:flex;justify-content:center;gap:0;font-stretch:75%;font-size:20px;letter-spacing:.14em;line-height:1}
.tix span{padding:0 20px;font-weight:700;color:var(--white)}
.tix span+span{border-left:2px solid var(--red)}
.tix em{font-style:normal;color:var(--red);font-weight:800}

/* partners */
.rule{left:60px;right:60px;top:1284px;height:1px;background:linear-gradient(90deg,transparent,rgba(244,242,238,.22) 20%,rgba(244,242,238,.22) 80%,transparent)}
.partners{left:60px;right:60px;top:1308px;display:flex;align-items:center;justify-content:space-between}
.pres{display:flex;align-items:center;gap:16px;padding-right:26px;border-right:1px solid rgba(244,242,238,.2)}
.lbl{font-weight:600;font-stretch:100%;font-size:10px;letter-spacing:.32em;color:var(--grey);line-height:1.5;text-align:right}
.partners img{display:block;opacity:.9}

.tag{left:0;right:0;top:486px;display:flex;justify-content:center;align-items:center;gap:14px;font-weight:800;font-stretch:75%;font-size:17px;letter-spacing:.42em;color:var(--white);line-height:1;text-shadow:0 2px 10px rgba(0,0,0,.9)}
.tag i{width:26px;height:2px;background:var(--red)}
.tag i:last-child{margin-left:-.42em}
.grain{inset:0;background:url(grain.png) 0 0/512px 512px;mix-blend-mode:overlay;opacity:.32}
</style></head>
<body><div id="p">
  <img class="abs num" src="numeral.png" alt="01">
  <div class="abs f fL"><img src="ufc_fighter_L.png" alt=""></div>
  <div class="abs f fR"><img src="ufc_fighter_R.png" alt=""></div>
  <div class="abs floor"></div>
  <div class="abs fx"></div>
  <img class="abs war" src="war_logo.png" alt="WAR Fighting Championships">
  <div class="abs tag"><i></i>PROVE YOU BELONG<i></i></div>

  <div class="abs bout"><span>LIGHTWEIGHT BOUT</span></div>
  <div class="abs names">
    <div class="nm"><div class="first">JAMAL</div><div class="sur">Issa</div></div>
    <div class="vs">VS</div>
    <div class="nm"><div class="first">ZAC</div><div class="sur">White</div></div>
  </div>

  <div class="abs date">SATURDAY 20 FEBRUARY <b>2027</b></div>
  <div class="abs venue">WESTERN SYDNEY CONVENTION CENTRE &nbsp;·&nbsp; PENRITH PANTHERS</div>
  <div class="abs tix"><span>DOORS 5:30PM</span><span>TICKETS <em>WARFC.ORG</em></span></div>

  <div class="abs rule"></div>
  <div class="abs partners">
    <div class="pres"><div class="lbl">PRESENTED<br>BY</div><img src="sp_ax.png" style="height:56px"></div>
    <img src="sp_yac.png" style="height:44px">
    <img src="sp_rab.png" style="height:54px">
    <img src="sp_cagecraft.png" style="height:48px">
    <img src="sp_panthers.png" style="height:50px">
    <img src="sp_wscc.png" style="height:44px">
  </div>

  <div class="abs grain"></div>
</div></body></html>
